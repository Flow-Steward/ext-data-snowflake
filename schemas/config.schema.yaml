$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: Snowflake connection settings
additionalProperties: false
required:
- prebuilt
- account
- user
- database
- schema
- warehouse
- role
properties:
  prebuilt:
    type: string
    enum:
    - snowflake
    title: SQL interface
    default: snowflake
    description: Snowflake SQL interface; this extension cannot select another database.
    const: snowflake
    readOnly: true
  account:
    type: string
    title: Account identifier
    description: Snowflake account identifier.
  user:
    type: string
    title: User
    description: Snowflake user.
  database:
    type: string
    title: Database
    description: Snowflake database.
  schema:
    type: string
    title: Schema
    description: Snowflake schema (required by the pinned source).
  warehouse:
    type: string
    title: Warehouse
    description: Explicit Snowflake warehouse; choose the intended warehouse and a least-privilege role.
    minLength: 1
  role:
    type: string
    title: Role
    description: Explicit Snowflake role; choose the intended warehouse and a least-privilege role.
    minLength: 1
  env:
    type: object
    title: Advanced Snowflake environment
    additionalProperties: false
    properties:
      SNOWFLAKE_ACCOUNT:
        type: string
      SNOWFLAKE_USER:
        type: string
      SNOWFLAKE_DATABASE:
        type: string
      SNOWFLAKE_SCHEMA:
        type: string
      SNOWFLAKE_WAREHOUSE:
        type: string
        minLength: 1
      SNOWFLAKE_ROLE:
        type: string
        minLength: 1
    description: Optional Snowflake source environment overrides only. Credentials belong in secrets.
