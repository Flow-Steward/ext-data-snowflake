$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: Snowflake credentials
additionalProperties: false
properties:
  password:
    type: string
    title: Snowflake password
    description: Password for the selected Snowflake user.
    minLength: 1
  env:
    type: object
    title: Advanced Snowflake secret environment
    additionalProperties: false
    properties:
      SNOWFLAKE_PASSWORD:
        type: string
        minLength: 1
    description: Optional Snowflake password environment override.
anyOf:
- required:
  - password
- required:
  - env
  properties:
    env:
      required:
      - SNOWFLAKE_PASSWORD
